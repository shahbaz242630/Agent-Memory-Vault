[package]
name = "vault-tauri"
description = "Tauri shell. Bridges UI to the application core via Tauri commands; handles installer concerns. See BRD §5.11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# vault-tauri is BOTH a library (testable utility functions) AND a binary
# (the Tauri shell). ADR-003 "converts to binary at T0.1.11" interpreted as
# "add binary target" — keeping the lib target lets us unit-test env-var
# parsing, OS-dispatch, and integrity-failure mapping without launching the
# Tauri runtime. Standard Rust pattern for testable applications.
[lib]
name = "vault_tauri"
path = "src/lib.rs"

[[bin]]
name = "vault-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }

# Workspace types we wire through.
vault-core = { path = "../vault-core" }
vault-app = { path = "../vault-app" }
vault-storage = { path = "../vault-storage" }
# Phase 4b: Tauri commands dispatch through Adapter (vault-mcp trait + ToolInvokeDetails / ToolInvokeError) and build RetrievalQuery (vault-retrieval).
vault-mcp = { path = "../vault-mcp" }
vault-retrieval = { path = "../vault-retrieval" }
# ADR-087 first-run model acquisition (BRD §5.11). `vault-embedding` supplies
# the pinned reranker SHA-256 constants; `vault-llm` supplies the ADR-043
# download-and-verify routine that `model_fetch` reuses rather than duplicates.
# Neither is new transitive weight — both already arrive via vault-app.
vault-embedding = { path = "../vault-embedding" }
vault-llm = { path = "../vault-llm" }

# Async runtime + tracing per workspace deps.
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Error types for ConfigError per ADR-032 + ADR-019 OS-dispatch errors.
thiserror = { workspace = true }

[dev-dependencies]
# `model_fetch` path-resolution tests assert against a real temp directory to
# prove the lookup helper creates nothing on disk.
tempfile = { workspace = true }
