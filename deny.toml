# cargo-deny configuration -- supply-chain gate for the dependency tree.
#
# Ported from the "Secrets and dependencies" gate already proven on
# tools-project, adapted from the npm ecosystem to Cargo. Runs in CI as a
# required status check on every pull request.
#
# WHY THIS EXISTS: CI verified that OUR code compiles, is warning-free and
# passes tests. Nothing verified the ~700 crates we ship inside the MSI. A
# dependency with a published RustSec advisory, an unexpected copyleft
# licence, or a crate pulled from somewhere other than crates.io would all
# have shipped to a beta user unnoticed.

[graph]
# Evaluate every platform we ship, not just the host. A Windows-only
# advisory must fail the Linux CI runner too, or the gate is theatre.
all-features = false

[advisories]
version = 2
# RustSec advisory database. Anything unignored that matches is an error.
# Add an entry here ONLY with a dated comment explaining why it cannot be
# fixed and when it will be revisited -- never to silence a red build.
ignore = []

[licenses]
version = 2
# We ship a COMMERCIAL desktop app in three modes (Local / BYOK / Managed).
# The repository being public does not make a strong-copyleft dependency
# safe: GPL/AGPL terms would reach the Managed service and the distributed
# binary. Permissive licences only, by allow-list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# A duplicated crate version is usually harmless transitive drift, not a
# security event -- warn so it is visible without failing the build.
multiple-versions = "warn"
# A wildcard version requirement means a future publish can change what we
# ship without a lockfile diff to review. That IS a supply-chain event.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. An unknown registry or an ad-hoc git
# dependency is the exact shape of a dependency-confusion attack, and would
# otherwise be invisible in review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
